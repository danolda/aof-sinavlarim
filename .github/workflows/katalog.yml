name: Bölüm ve ders kataloğu

on:
  schedule:
    - cron: '17 3 * * 1'   # her pazartesi 06:17 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kataloğu üret
        run: python3 tools/katalog.py --delay 1.0
      - name: Değiştiyse commit at
        run: |
          if git diff --quiet -- data/; then
            echo "Katalog değişmedi."
            exit 0
          fi
          git config user.name "katalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/katalog-*.json
          git commit -m "Kataloğu güncelle ($(date -u +%Y-%m-%d))"
          git push
